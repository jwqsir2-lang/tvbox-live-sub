name: Build TVBox Config

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build config
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TVBoxv3xg.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: auto refresh live sources $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
